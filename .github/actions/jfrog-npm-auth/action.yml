name: JFrog npm auth
description: OIDC login to JFrog and point npm/pnpm at the given Artifactory npm registry (writes ~/.npmrc).
inputs:
  registry:
    description: Artifactory npm registry host and path, without scheme or trailing slash (e.g. jfrog.ledgerlabs.net/artifactory/api/npm/<repo>).
    required: true
runs:
  using: composite
  steps:
    # OIDC only, never a static token: the calling job needs `id-token: write`, and the runner
    # must be IP-whitelisted by JFrog (Ledger larger GitHub-hosted or self-hosted runners).
    - id: jfrog-login
      if: ${{ inputs.registry != '' }}
      uses: LedgerHQ/actions-security/actions/jfrog-login@3868be0ef1ec8722fbdb2c6cda90f739cbfc742d # actions/jfrog-login-1.4.0
    # Written to $HOME rather than the checkout: pnpm ignores env variables in a project
    # .npmrc, and the token must never land in a file changesets could commit.
    - id: jfrog-npm
      if: ${{ inputs.registry != '' }}
      uses: LedgerHQ/actions-security/actions/jfrog-npm@f72bc626ca84f2399fa070b16e7f804b6043aa82 # actions/jfrog-npm-0.3.0
      with:
        token: ${{ steps.jfrog-login.outputs.oidc-token }}
        registry: ${{ inputs.registry }}
        npmrc-location: "$HOME/.npmrc"
