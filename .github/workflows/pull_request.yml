name: Pull Request Checks
on: pull_request

permissions:
  contents: read
  id-token: write # JFrog OIDC login

jobs:
  # Installs through JFrog like every job that fetches packages (cybersec requirement), hence
  # the JFrog-whitelisted runner and the OIDC login. Pull requests from forks get no OIDC
  # token, so their checks fail at the login step.
  checks:
    runs-on: public-ledgerhq-shared-medium
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # Before pnpm/action-setup, which downloads pnpm itself with npm.
      - uses: ./.github/actions/jfrog-npm-auth
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Check for diff in docs
        run: git diff --exit-code || exit 1
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # - name: Uploading to codecov.io
      #   run: npx codecov
      #   env:
      #     CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
