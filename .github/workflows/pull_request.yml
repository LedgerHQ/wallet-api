name: Pull Request Checks
on: pull_request

permissions:
  contents: read
  id-token: write # JFrog OIDC login

jobs:
  # Installs through JFrog like every job that fetches packages (cybersec requirement), hence
  # the JFrog-whitelisted runner and the OIDC login. Pull requests from forks get no OIDC
  # token, so their checks fail at the login step.
  checks:
    runs-on: public-ledgerhq-shared-medium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before pnpm/action-setup, which downloads pnpm itself with npm.
      - uses: ./.github/actions/jfrog-npm-auth
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Check for diff in docs
        run: git diff --exit-code || exit 1
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # - name: Uploading to codecov.io
      #   run: npx codecov
      #   env:
      #     CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
